# TbotAtm (bottom temperature + atmosphere) kfold config
# Usage: python scripts/train.py --config configs/kfold/TbotAtm.yaml --fold 0

data_dir: ""  # set via MHW_DATA_FILE env var or pass --data_dir at runtime
variables:
  - ptho_bot
  - u10
  - v10
  - msl
  - ssr
ocean_variables:
  - ptho_bot
in_channels: 5
arch: lstm_only
gaussian_nll: false
temporal_features: 0

split_mode: kfold
n_folds: 5
fold: 0          # override with --fold N
seed: 42

normalize: true
clim_ref_start: 1985
clim_ref_end: 2014
clim_window: 5

loss_fn: MSELoss
num_workers: 4
cnn_features: 256
lstm_hidden: 512
lstm_layers: 2
dropout: 0.2
learning_rate: 0.0001
batch_size: 16
max_epochs: 1000
window_size: 60
lead_time: 7

output_dir: ""  # set at runtime; default: $MHW_EXPERIMENTS_DIR/<experiment_name>
