# Local-only partition config — fold and seed passed as CLI args
# Usage: python scripts/train_partition.py --config configs/partition/local.yaml --mode local_only --fold 0

data_dir: /p/project1/hai_1127/inputs/daily/preprocess_data/merged_daily.nc
variables:
  - ptho_bot
  - u10
  - v10
  - msl
  - ssr
ocean_variables:
  - ptho_bot
in_channels: 5
arch: lstm_only
gaussian_nll: false
temporal_features: 0

split_mode: kfold
n_folds: 5
fold: 0          # override with --fold N
seed: 42

normalize: true
clim_ref_start: 1985
clim_ref_end: 2014
clim_window: 5

loss_fn: MSELoss
num_workers: 4
cnn_features: 256
lstm_hidden: 512
lstm_layers: 2
dropout: 0.2
learning_rate: 0.0001
batch_size: 16
max_epochs: 1000
window_size: 60
lead_time: 7

output_dir: /p/project1/hai_1127/radin1/exprecursors/experiments/partition/TbotAtm_local_seed42_fold0
